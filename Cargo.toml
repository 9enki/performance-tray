[package]
name = "performance-tray"
version = "1.0.0"
edition = "2021"
description = "CPU とメモリの使用率をタスクトレイに数字で表示する最小アプリ"
license = "MIT"
repository = "https://github.com/9enki/performance-tray"
publish = false

[[bin]]
name = "PerformanceTray"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
